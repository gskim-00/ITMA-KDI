<div class="section-container">
    <div class="section-header">
        <h2 class="section-title">
            <i class="bi bi-database-fill-down"></i> 데이터베이스 백업
        </h2>
        <p class="section-description">
            자산관리 데이터베이스를 백업하고 복원할 수 있습니다.
        </p>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-download"></i> 백업 생성
                </div>
                <div class="card-body database-backup-card">
                    <p>전체 데이터베이스를 백업 파일로 생성합니다.</p>

                    <div class="mb-3">
                        <label class="form-label">백업 설명</label>
                        <input type="text" id="backupDescription" class="form-control" placeholder="예: 월간 백업 2024-01">
                    </div>

                    <button id="btnCreateBackup" class="btn btn-primary">
                        <i class="bi bi-download"></i> 백업 생성
                    </button>

                    <div id="backupProgress" class="mt-3" style="display: none;">
                        <div class="progress">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
                        </div>
                        <small class="text-muted">백업 생성 중...</small>
                    </div>
                </div>
            </div>

            <div class="card database-restore-card mt-4">
                <div class="card-header bg-warning text-dark">
                    <i class="bi bi-upload"></i> 백업 복원
                </div>
                <div class="card-body">
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i>
                        <strong>주의:</strong> 백업 복원 시 현재 데이터가 변경됩니다.
                    </div>

                    <div class="mb-3">
                        <label class="form-label">백업 파일 선택</label>
                        <input type="file" id="restoreFile" class="form-control" accept=".sql,.dump">
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="clearBeforeRestore" checked>
                        <label class="form-check-label" for="clearBeforeRestore">
                            복원 전 기존 스키마 초기화 (권장)
                        </label>
                    </div>

                    <button id="btnRestoreBackup" class="btn btn-warning">
                        <i class="bi bi-upload"></i> 백업 복원
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <i class="bi bi-clock-history"></i> 백업 이력
                </div>
                <div class="card-body database-backuplist-card">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm">
                            <thead>
                                <tr>
                                    <th>생성일시</th>
                                    <th>설명</th>
                                    <th>크기</th>
                                    <th>동작</th>
                                </tr>
                            </thead>
                            <tbody id="backupHistoryTable">
                                <tr>
                                    <td colspan="4" class="text-center text-muted">
                                        <div class="spinner-border spinner-border-sm" role="status">
                                            <span class="visually-hidden">로딩 중...</span>
                                        </div>
                                        로딩 중...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card database-autobackup-card mt-4">
                <div class="card-header bg-secondary text-white ">
                    <i class="bi bi-gear"></i> 자동 백업 설정
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">자동 백업 활성화</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="autoBackupEnabled">
                            <label class="form-check-label" for="autoBackupEnabled">
                                자동 백업 사용
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">백업 주기</label>
                        <select class="form-select" id="backupFrequency">
                            <option value="daily">매일</option>
                            <option value="weekly" selected>매주</option>
                            <option value="monthly">매월</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">최대 보관 개수</label>
                        <input type="number" id="maxBackups" class="form-control" value="10" min="1" max="100">
                        <small class="form-text text-muted">오래된 백업은 자동으로 삭제됩니다.</small>
                    </div>

                    <button id="btnSaveAutoBackup" class="btn btn-secondary">
                        <i class="bi bi-check-circle"></i> 설정 저장
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
