<div class="section-container">
    <div class="section-header">
        <h2 class="section-title">
            <i class="bi bi-heart-pulse"></i> 시스템 상태
        </h2>
        <p class="section-description">
            데이터베이스, 디스크, 메모리 등 시스템 리소스 상태를 실시간으로 모니터링합니다
        </p>
    </div>

    <!-- 상태 카드들 -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <i class="bi bi-database-check" style="font-size: 2rem; color: #28a745;"></i>
                    <h6 class="mt-2">데이터베이스</h6>
                    <h3 id="dbStatus"><span class="badge bg-secondary">확인중...</span></h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <i class="bi bi-hdd" style="font-size: 2rem; color: #17a2b8;"></i>
                    <h6 class="mt-2">디스크 용량</h6>
                    <h3 id="diskUsage"><span class="badge bg-secondary">확인중...</span></h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <i class="bi bi-memory" style="font-size: 2rem; color: #ffc107;"></i>
                    <h6 class="mt-2">메모리</h6>
                    <h3 id="memoryUsage"><span class="badge bg-secondary">확인중...</span></h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <i class="bi bi-server" style="font-size: 2rem; color: #6c757d;"></i>
                    <h6 class="mt-2">서버 상태</h6>
                    <h3 id="serverStatus"><span class="badge bg-secondary">확인중...</span></h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- 데이터베이스 상태 -->
        <div class="col-md-6">
            <div class="card database-status-card">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-database"></i> 데이터베이스 상세 정보
                </div>
                <div class="card-body">
                    <table class="table table-sm table-borderless">
                        <tbody>
                            <tr>
                                <td class="fw-bold" style="width: 150px;">연결 상태</td>
                                <td id="dbConnectionStatus">-</td>
                            </tr>
                            <tr>
                                <td class="fw-bold">버전</td>
                                <td id="dbVersion">-</td>
                            </tr>
                            <tr>
                                <td class="fw-bold">데이터베이스 크기</td>
                                <td id="dbSize">-</td>
                            </tr>
                            <tr>
                                <td class="fw-bold">활성 연결 수</td>
                                <td id="dbConnections">-</td>
                            </tr>
                            <tr>
                                <td class="fw-bold">테이블 수</td>
                                <td id="dbTables">-</td>
                            </tr>
                            <tr>
                                <td class="fw-bold">마지막 백업</td>
                                <td id="dbLastBackup">-</td>
                            </tr>
                        </tbody>
                    </table>
                    <button id="btnRefreshDbStatus" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-arrow-clockwise"></i> 새로고침
                    </button>
                    <button id="btnTestDbConnection" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-plug"></i> 연결 테스트
                    </button>
                </div>
            </div>
        </div>

        <!-- 디스크 및 리소스 -->
        <div class="col-md-6">
            <div class="card resource-status-card">
                <div class="card-header bg-info text-white">
                    <i class="bi bi-hdd-stack"></i> 리소스 사용량
                </div>
                <div class="card-body">
                    <div class="mb-4">
                        <label class="fw-bold">디스크 사용량</label>
                        <div class="progress" style="height: 25px;">
                            <div id="diskProgressBar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <small class="text-muted" id="diskSpace">-</small>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold">파일 용량</label>
                        <div class="progress" style="height: 25px;">
                            <div id="uploadsProgressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%">0 MB</div>
                        </div>
                        <small class="text-muted" id="uploadsSize">-</small>
                    </div>

                    <table class="table table-sm table-borderless">
                        <tbody>
                            <tr>
                                <td class="fw-bold" style="width: 150px;">서버 시작 시간</td>
                                <td id="serverStartTime">-</td>
                            </tr>
                            <tr>
                                <td class="fw-bold">가동 시간</td>
                                <td id="uptime">-</td>
                            </tr>
                            <tr>
                                <td class="fw-bold">Python 버전</td>
                                <td id="pythonVersion">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <i class="bi bi-exclamation-triangle"></i> 알림 임계값 설정
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="form-label">디스크 사용률 경고 (%)</label>
                            <input type="number" id="diskThreshold" class="form-control" value="80" min="50" max="95">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">DB 크기 경고 (GB)</label>
                            <input type="number" id="dbSizeThreshold" class="form-control" value="10" min="1" max="100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">파일 용량 경고 (GB)</label>
                            <input type="number" id="uploadsThreshold" class="form-control" value="5" min="1" max="50">
                        </div>
                    </div>
                    <button id="btnSaveThresholds" class="btn btn-warning mt-3">
                        <i class="bi bi-check-circle"></i> 임계값 저장
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
