<div class="section-container">
    <div class="section-header">
        <h2 class="section-title">
            <i class="bi bi-gear"></i> 이메일 SMTP 설정
        </h2>
        <p class="section-description">
            이메일 SMTP 서버, 발신자 프로필 및 연결 테스트를 설정합니다.
        </p>
    </div>
    <div class="section-body">
        <div class="row">
            <div class="col-lg-6">
                <form id="emailSettingsForm">
                    <div class="mb-3">
                        <label class="form-label">SMTP 서버</label>
                        <input type="text" name="smtp_server" class="form-control"
                            placeholder="smtp.gmail.com" autocomplete="off" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SMTP 포트</label>
                        <input type="number" name="smtp_port" class="form-control"
                            placeholder="587" autocomplete="off" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">사용자명 (이메일)</label>
                        <input type="email" name="smtp_username" class="form-control"
                            placeholder="your-email@gmail.com" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">비밀번호</label>
                        <input type="password" name="smtp_password" class="form-control" autocomplete="current-password" placeholder="*******" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">발신자 이메일</label>
                        <input type="email" name="sender_email" class="form-control" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">발신자 이름</label>
                        <input type="text" name="sender_name" class="form-control"
                            placeholder="자산 관리 시스템" autocomplete="name" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="useTlsCheckbox" checked>
                        <label class="form-check-label" for="useTlsCheckbox">
                            TLS 사용
                        </label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 저장
                        </button>
                        <button type="button" id="testSmtpBtn" class="btn btn-outline-info">
                            <i class="bi bi-arrow-repeat"></i> 연결 테스트
                        </button>
                    </div>
                    <div id="emailSettingsResult" style="display: none;" class="mt-3"></div>
                </form>

                <div class="alert alert-info mt-4">
                    <h6>
                        <i class="bi bi-info-circle"></i> SMTP 서버 예시
                    </h6>
                    <strong>Gmail:</strong>
                    <small>smtp.gmail.com:587 (TLS)</small><br><br>
                    <strong>Naver:</strong>
                    <small>smtp.naver.com:587 (TLS)</small><br><br>
                    <strong>Outlook:</strong>
                    <small>smtp-mail.outlook.com:587 (TLS)</small>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card border-info">
                    <div class="card-header bg-info text-white">
                        <i class="bi bi-info-square"></i> 현재 적용된 설정
                    </div>
                    <div class="card-body">
                        <table class="table table-sm table-borderless mb-0">
                            <tbody>
                                <tr>
                                    <td class="fw-bold" style="width: 180px;">SMTP 서버</td>
                                    <td><small id="currentSmtpServer">-</small></td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">SMTP 포트</td>
                                    <td><small id="currentSmtpPort">-</small></td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">사용자명</td>
                                    <td><small id="currentSmtpUsername">-</small></td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">발신자 이메일</td>
                                    <td><small id="currentSenderEmail">-</small></td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">발신자 이름</td>
                                    <td><small id="currentSenderName">-</small></td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">TLS 사용</td>
                                    <td><span id="currentUseTls" class="badge bg-secondary">-</span></td>
                                </tr>
                                <tr>
                                    <td class="fw-bold">마지막 수정</td>
                                    <td><small id="currentUpdatedAt">-</small></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
