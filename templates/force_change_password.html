<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <main class="login-form text-center">
        <form method="POST" action="{{ url_for('auth.force_change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <h1 class="h4 mb-3 fw-normal">새 비밀번호 설정</h1>
            <p class="text-muted small mb-3">임시 비밀번호로 로그인되어 비밀번호 변경이 필요합니다.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="small mb-2 text-center {% if category == 'success' %}text-success{% elif category == 'warning' %}text-warning{% else %}text-danger{% endif %}" style="font-weight: bold;">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <div class="mb-3">
                <input type="password" name="new_password" class="form-control" placeholder="새 비밀번호" autocomplete="new-password" required>
            </div>
            <div class="mb-3">
                <input type="password" name="confirm_password" class="form-control" placeholder="새 비밀번호 확인" autocomplete="new-password" required>
            </div>
            <button class="w-100 btn btn-lg btn-primary" type="submit">비밀번호 변경</button>
            <a class="d-inline-block mt-3 small text-muted" href="{{ url_for('auth.logout') }}">로그아웃</a>
        </form>
    </main>
</body>
</html>
