<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE ITMA - 권한 대기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="access-pending-body">
    <main class="access-pending-wrap">
        <section class="access-pending-card">
            <div class="access-pending-badge">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1 class="access-pending-title">그룹/권한 배정이 필요합니다</h1>
            <p class="access-pending-text">
                로그인은 성공했지만 현재 계정은 IT자산관리 그룹 또는</br> 
                카테고리 권한이 배정되지 않았습니다.
            </p>
            <div class="access-pending-alert">
                관리자에게 그룹/권한 설정을 재요청한 뒤 다시 접속해주세요.
            </div>
            <dl class="access-pending-meta">
                <div>
                    <dt>사용자</dt>
                    <dd>{{ real_name or username }}</dd>
                </div>
                <div>
                    <dt>계정</dt>
                    <dd>{{ username }}</dd>
                </div>
                <div>
                    <dt>역할</dt>
                    <dd>{{ role }}</dd>
                </div>
            </dl>
            <div class="access-pending-actions">
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary">로그아웃</a>
                <a href="{{ url_for('auth.access_pending') }}" class="btn btn-primary">다시 확인</a>
            </div>
        </section>
    </main>
</body>
</html>
