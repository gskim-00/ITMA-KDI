<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITMA 대시보드 라이브</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/itma.css') }}?v=20261125b">
</head>
<body class="itma-dashboard-live-shell" data-dashboard-token="{{ token }}" data-dashboard-refresh="{{ refresh_minutes|default('5') }}">
    <div class="itma-dashboard-live-header">
        <div>
            <h1 class="itma-dashboard-live-title"><i class="bi bi-speedometer2"></i> ONE ITMA 대시보드</h1>
            <div class="itma-dashboard-live-meta">
                마지막 갱신: <span id="liveLastRefreshed">-</span>
                <span class="mx-2">|</span>
                서버 시간: <span id="liveServerTime">-</span>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <label for="liveRefreshInterval" class="form-label mb-0 small text-muted">자동 갱신</label>
            <select id="liveRefreshInterval" class="form-select form-select-sm" style="width: 130px;">
                <option value="5" {% if refresh_minutes == '5' %}selected{% endif %}>5분</option>
                <option value="10" {% if refresh_minutes == '10' %}selected{% endif %}>10분</option>
                <option value="30" {% if refresh_minutes == '30' %}selected{% endif %}>30분</option>
                <option value="60" {% if refresh_minutes == '60' %}selected{% endif %}>1시간</option>
            </select>
            <button type="button" id="btnLiveRefreshNow" class="btn btn-sm btn-primary">
                <i class="bi bi-arrow-clockwise"></i> 즉시 갱신
            </button>
        </div>
    </div>

    <div class="itma-dashboard-hero mb-3">
        <article class="itma-hero-card hero-d"><div class="hero-title">전체 자산</div><div class="hero-value" id="itmaKpiTotalCount">0</div><i class="bi bi-box-seam hero-icon"></i></article>
        <article class="itma-hero-card hero-a"><div class="hero-title">구분</div><div class="hero-value" id="itmaKpiCategoryCount">0</div><i class="bi bi-grid-3x3-gap hero-icon"></i></article>
        <article class="itma-hero-card hero-b"><div class="hero-title">제조사</div><div class="hero-value" id="itmaKpiManufacturerCount">0</div><i class="bi bi-building hero-icon"></i></article>
        <article class="itma-hero-card hero-c"><div class="hero-title">보관위치</div><div class="hero-value" id="itmaKpiStorageCount">0</div><i class="bi bi-geo-alt hero-icon"></i></article>
    </div>

    <div class="itma-dashboard-hero mb-3">
        <article class="itma-hero-card hero-b"><div class="hero-title">사용 장비</div><div class="hero-value" id="itmaKpiInUseCount">0</div><i class="bi bi-check-circle hero-icon"></i></article>
        <article class="itma-hero-card hero-c"><div class="hero-title">미사용 장비</div><div class="hero-value" id="itmaKpiUnusedCount">0</div><i class="bi bi-x-circle hero-icon"></i></article>
        <article class="itma-hero-card hero-a"><div class="hero-title">최근 30일 수정</div><div class="hero-value" id="itmaKpiUpdated30d">0</div><i class="bi bi-clock-history hero-icon"></i></article>
        <article class="itma-hero-card hero-d"><div class="hero-title">데이터 품질 점수</div><div class="hero-value" id="itmaKpiQualityScore">0점</div><i class="bi bi-stars hero-icon"></i></article>
    </div>

    <div class="itma-dashboard-progress mb-3">
        <article class="itma-progress-card"><div class="progress-title">구분 입력 진행률</div><div class="progress-track"><div class="progress-fill" id="itmaProgCategoryBar"></div></div><div class="progress-meta"><span>입력률</span><strong id="itmaProgCategoryText">0%</strong></div></article>
        <article class="itma-progress-card"><div class="progress-title">제조사 입력 진행률</div><div class="progress-track"><div class="progress-fill" id="itmaProgManufacturerBar"></div></div><div class="progress-meta"><span>입력률</span><strong id="itmaProgManufacturerText">0%</strong></div></article>
        <article class="itma-progress-card"><div class="progress-title">보관위치 입력 진행률</div><div class="progress-track"><div class="progress-fill" id="itmaProgStorageBar"></div></div><div class="progress-meta"><span>입력률</span><strong id="itmaProgStorageText">0%</strong></div></article>
        <article class="itma-progress-card"><div class="progress-title">시리얼번호 입력 진행률</div><div class="progress-track"><div class="progress-fill" id="itmaProgSerialBar"></div></div><div class="progress-meta"><span>입력률</span><strong id="itmaProgSerialText">0%</strong></div></article>
        <article class="itma-progress-card"><div class="progress-title">자산번호 입력 진행률</div><div class="progress-track"><div class="progress-fill" id="itmaProgAssetIdBar"></div></div><div class="progress-meta"><span>입력률</span><strong id="itmaProgAssetIdText">0%</strong></div></article>
    </div>

    <div class="itma-dashboard-insight-grid">
        <section class="itma-insight-card">
            <div class="itma-insight-header"><h6 class="mb-0">구분</h6><span class="small text-muted">전체 <strong id="itmaCategoryTotalInTab">0</strong></span></div>
            <div class="itma-insight-body">
                <div class="table-responsive itma-insight-table-wrap"><table class="table table-sm table-striped mb-0 itma-insight-table"><thead><tr><th>구분</th><th class="text-end">수량</th><th class="text-end">비율</th></tr></thead><tbody id="itmaCategorySummaryBody"></tbody></table></div>
                <div class="itma-donut-row"><div class="itma-donut" id="itmaCategoryDonut"></div><div class="itma-donut-legend" id="itmaCategoryLegend"></div></div>
            </div>
        </section>
        <section class="itma-insight-card">
            <div class="itma-insight-header"><h6 class="mb-0">제조사</h6><span class="small text-muted">전체 <strong id="itmaManufacturerTotalInTab">0</strong></span></div>
            <div class="itma-insight-body">
                <div class="table-responsive itma-insight-table-wrap"><table class="table table-sm table-striped mb-0 itma-insight-table"><thead><tr><th>제조사</th><th class="text-end">수량</th><th class="text-end">비율</th></tr></thead><tbody id="itmaManufacturerSummaryBody"></tbody></table></div>
                <div class="itma-donut-row"><div class="itma-donut" id="itmaManufacturerDonut"></div><div class="itma-donut-legend" id="itmaManufacturerLegend"></div></div>
            </div>
        </section>
        <section class="itma-insight-card">
            <div class="itma-insight-header"><h6 class="mb-0">보관위치</h6><span class="small text-muted">전체 <strong id="itmaStorageTotalInTab">0</strong></span></div>
            <div class="itma-insight-body">
                <div class="table-responsive itma-insight-table-wrap"><table class="table table-sm table-striped mb-0 itma-insight-table"><thead><tr><th>보관위치</th><th class="text-end">수량</th><th class="text-end">비율</th></tr></thead><tbody id="itmaStorageSummaryBody"></tbody></table></div>
                <div class="itma-donut-row"><div class="itma-donut" id="itmaStorageDonut"></div><div class="itma-donut-legend" id="itmaStorageLegend"></div></div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/itma-dashboard-live.js') }}"></script>
</body>
</html>
